# 游戏柜和番剧。分数和中文短评从 Bangumi 拉（python tools/update-games.py），
# 封面也由那个脚本下载到 assets/img/games/ 和 assets/img/anime/。
# 只放 9 分以上的；8 分的只有在有特别意义时才放（写在 badge 里）。
# 每一排按我在 Bangumi 上打分的时间排，先打分的在前，所以这里的先后顺序不影响显示。
# 2023 年 4 月以前玩的（加入 Bangumi 时一次补的分）排在最前，按发售时间；想自己定先后就写
# backlog = 1、2、3……，后来才打分的也能用它挪进这一组。
# hours 是游戏时长，Steam 上玩的按 Steam，别的平台玩的手填，没有就不写。短评显示在封面下面，游戏只有 10 分的有，番剧每部都有：中文默认取
# Bangumi 短评的第一句，写了 quote_zh 就用它；quote_en 是英文短评，手写。

