[projects.zh]
name = "自适应内容审核 Agent"
period = "2026.1 – 2026.3"
bullets = [
  '''内容审核不只是贴个标签，而是决定怎么处理。先抽出 <strong>8 个以上的风险信号</strong>（恶意程度、把握有多大、上下文），再让 <strong>ReAct Agent</strong> 挑一个轻重合适的做法：不管、降权、加一道门槛，或者限流。''',
  '''在 Jigsaw 恶意评论数据集上做了评测。关键在分寸：严重的限流，擦边的加门槛，越拿不准的处理得越小心。''',
]

[projects.en]
name = "Adaptive Moderation Agent"
period = "Jan – Mar 2026"
bullets = [
  '''Content moderation as a decision, not a label: a first pass extracts <strong>8+ structured risk signals</strong> (toxicity, uncertainty, context) and a <strong>ReAct agent</strong> picks a proportionate action: do nothing, downrank, add friction, or throttle.''',
  '''Evaluated on the Jigsaw toxic comment dataset. The point was calibration: severe content gets throttled, borderline content gets friction, and the uncertain cases are the ones the agent is most careful with.''',
]

