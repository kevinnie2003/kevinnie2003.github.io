]

[projects.en]
name = "RogueForge"
period = "May – Jun 2026"
alt = ["A fight in RogueForge"]
bullets = [
  '''An <strong>AI-native roguelike deck-builder</strong>: an LLM generates <strong>5 content types</strong> live during a run (cards, enemies, events, room rules and characters), each through the same <strong>generate, validate, repair, retry</strong> loop.''',
  '''The model only combines whitelisted effects; deterministic combat runs on the backend. Three validation layers (structure, mechanic allowlist, numerical budget) clamp what is close and bounce what is not, with the reason fed back for a retry.''',
  '''The budget is calibrated against real <em>Slay the Spire</em> cards, so "balanced" is measured, not guessed. Of <strong>2,658</strong> logged candidates, about <strong>95%</strong> were served. The validator from the game is right here, so you can try it.''',
]

