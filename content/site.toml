  '''给 Unity 武侠 RPG《活侠传》做的 Mod，C# 写了 <strong>3.6 万行</strong>，用 <strong>BepInEx / Harmony</strong> 打了 <strong>230 多个运行时补丁</strong>。功能包括路线图和剧情流程图（从 <strong>2,200 多个反编译的 Lua 剧本</strong>里解析出来）、靠 Lua 记录和重放实现的随时存档、数值修改等。<strong>两周发了 70 多个版本</strong>，GitHub <strong>100 多个 star</strong>，下载<strong>超过 2 万次</strong>，现在还在更新。''',
  '''最核心的是游戏里的 <strong>Tool-Calling Agent</strong>。它有 <strong>15 个工具</strong>，能查剧本里的分岔条件、<strong>上千个剧情旗标</strong>在哪设置和判定、每条路线的好感和数值合计，也能看实时存档和屏幕上的选项。它会先查几轮资料，再根据查到的东西回答，不靠记忆瞎编。''',
  '''<strong>11 个角色</strong>各用各的口吻聊天，只知道玩家已经读过的剧情，剧透分 <strong>3 档</strong>。想改存档，它会先弹一张卡片，玩家点确认才改。''',
  '''用一套 <strong>20 道题的评测</strong>加每轮的调试记录，一点点修检索排序、补工具、调提示词（普通模式 <strong>15/20</strong>，深度模式 <strong>18/20</strong>）。提示词前缀保持不变，思考内容原样传回，<strong>缓存命中率一直在 80% 到 86%</strong>。''',
]

[projects.en]
name = "Coffee Companion"
period = "Oct 2026 – Present"
alt = ["Coffee Companion banner", "The in-game AI companion", "Story route map"]
bullets = [
  '''A <strong>36K-line C#</strong> mod for the Unity wuxia RPG <em>Legend of Mortal</em>, built on <strong>BepInEx/Harmony</strong> with <strong>230+ runtime patches</strong>: a story route map and flowcharts parsed from <strong>2,200+ decompiled Lua scripts</strong>, save-anywhere through Lua record-and-replay, and a stat editor. <strong>70+ releases in two weeks</strong>, <strong>100+ stars</strong>, <strong>20K+ downloads</strong>, still in active development.''',
  '''The centrepiece is an in-game <strong>tool-calling agent</strong>. Its <strong>15 tools</strong> read a knowledge base built from the parsed scripts (branch conditions, where each of <strong>1,000+ story flags</strong> is set and checked, per-route totals of affinity and stats) plus the live save and the choices on screen. It looks things up over several rounds, then answers from what it found, not from memory.''',
  '''<strong>11 character personas</strong> talk in their own voice, know only the story the player has read, and respect <strong>3 spoiler levels</strong>. Any change to the save is proposed as a card and applied only when the player confirms.''',
  '''A <strong>20-question graded eval</strong> with per-turn traces drove the fixes to retrieval ranking, tool coverage and prompt rules (<strong>15/20</strong> standard, <strong>18/20</strong> deep mode). A stable prompt prefix and thinking blocks passed back unchanged keep the <strong>prompt cache hit rate at 80–86%</strong>.''',
]

