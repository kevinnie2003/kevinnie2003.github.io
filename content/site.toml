[projects.zh]
name = "U-Net 卫星图船只分割"
period = "2024.6 – 2024.12"
bullets = [
  '''在 Airbus 船只数据集（5 万多张卫星图）上改进 <strong>U-Net</strong>，加了深度可分离卷积和空洞卷积，<strong>Dice 0.63</strong>，<strong>精确率 0.67</strong>。船在图里只占很小一块，所以主要功夫花在损失函数（BCE、Dice、Focal）和跳跃连接上，主干网络没怎么动。''',
  '''以<strong>第一作者</strong>身份发表在 <em>Applied and Computational Engineering</em>（CONF-SPML 2025）。''',
]

[projects.en]
name = "Enhanced U-Net for Ship Segmentation"
period = "Jun – Dec 2024"
bullets = [
  '''A <strong>U-Net</strong> with depthwise-separable and atrous convolutions for the Airbus ship dataset (50k+ satellite images), reaching <strong>Dice 0.63</strong> and <strong>precision 0.67</strong>. Ships are tiny relative to the image, so the work was in the losses (BCE, Dice, Focal) and the skip connections, not the backbone.''',
  '''Published as <strong>first author</strong> in <em>Applied and Computational Engineering</em>, CONF-SPML 2025.''',
]

